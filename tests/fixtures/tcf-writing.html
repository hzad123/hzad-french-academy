<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local TCF writing acceptance fixture</title><link rel="stylesheet" href="/src/styles/academy.css"><div id="host"></div>
<script type="module">
import {template} from '/src/ui/template.js';
import {wireNavigation} from '/src/ui/navigation.js';
import {wireExams} from '/src/exams/ui.js';
import {wireTcfWriting} from '/src/exams/tcf-writing/ui.js';
import {wireAiLearning} from '/src/ai/ui.js';
import {createWritingHandler} from '/supabase/functions/academy-tcf-writing/handler.js';
import {CURRENT_BANK} from '/supabase/functions/academy-tcf-writing/banks.js';
import {validateWritingFeedback} from '/supabase/functions/academy-tcf-writing/scoring.js';
document.querySelector('#host').innerHTML=template();const root=document.querySelector('#hzad-french-academy');root.querySelector('#hz-auth').classList.add('hz-hidden');root.querySelector('#hz-dashboard').classList.remove('hz-hidden');wireNavigation(root);
const f=window.fixture={user:'11111111-1111-4111-8111-111111111111',callbacks:[],rows:new Map(),requests:new Map(),providerCalls:0,charges:0,paused:false,balance:100,failSave:false,delay:false};
const snapshot=()=>({enabled:!f.paused,activities:{'tcf-writing':{enabled:!f.paused,credits:1}},wallet:{available:f.balance,budgetAvailable:true,expiresAt:'2099-01-01'},history:[]});
const db={userRpc:async()=>snapshot(),adminRpc:async(name,p)=>{
 if(p.p_user!==f.user)throw Error('Writing attempt not found');
 if(name==='academy_tcf_writing_command'){
  if(p.p_action==='list')return [...f.rows.values()].filter(r=>r.owner===f.user).map(r=>({...r,reviewStatus:f.requests.get(r.id)?.status||null}));
  let row=f.rows.get(p.p_id);
  if(row&&row.owner!==f.user)throw Error('Writing attempt not found');
  if(p.p_action==='start'&&!row){row=[...f.rows.values()].filter(r=>r.owner===f.user&&r.testId===p.p_payload.testId&&r.status==='draft'&&r.version===CURRENT_BANK.version&&Date.parse(r.deadline)>Date.now()).sort((a,b)=>Number(b.responses.some(Boolean))-Number(a.responses.some(Boolean))||Date.parse(b.startedAt)-Date.parse(a.startedAt))[0]}
  if(p.p_action==='start'&&!row){const now=Date.now();row={id:p.p_id,owner:f.user,testId:p.p_payload.testId,version:p.p_payload.version||'tcf-writing-2026-11-v1',responses:['','',''],revision:0,status:'draft',startedAt:new Date(now).toISOString(),deadline:new Date(now+3600000).toISOString()};f.rows.set(p.p_id,row)}
  if(!row)throw Error('Writing attempt not found');
  if(p.p_action==='save'){
   if(f.failSave)throw Error('Writing connection interrupted');
   if(row.status!=='draft')throw Error('Submitted writing is locked');
   if(Date.now()>=Date.parse(row.deadline))throw Error('Writing time has ended');
   if(p.p_payload.revision!==row.revision)throw Error('Writing changed in another tab');
   row.responses=structuredClone(p.p_payload.responses);row.revision++;
  }
  if(p.p_action==='submit'){row.status='submitted';row.revision++}
  const r=f.requests.get(row.id);return {...structuredClone(row),serverNow:new Date().toISOString(),reviewStatus:r?.status||null,result:r?.result||null};
 }
 if(name==='academy_ai_reserve'){
  let r=f.requests.get(p.p_id);if(!r){r={status:'reserved'};f.requests.set(p.p_id,r);f.balance-=1;f.charges++}return {...r};
 }
 if(name==='academy_ai_claim'){const r=f.requests.get(p.p_id);if(r.status!=='reserved')return {claimed:false};r.status='dispatched';return {claimed:true,model:'fixture-model',maxOutputTokens:2000}}
 if(name==='academy_ai_finish'){const r=f.requests.get(p.p_id);r.status='completed';r.result=p.p_result;return {...r}}
 if(name==='academy_ai_fail'){f.requests.get(p.p_id).status='failed';f.balance+=1;return null}
 throw Error('Unexpected fixture RPC');
}};
const handler=createWritingHandler({authenticate:async()=>f.user?{id:f.user,email_confirmed_at:'yes'}:null,db,provider:{ready:()=>true,run:async({test,responses})=>{
 f.providerCalls++;if(f.delay)await new Promise(resolve=>{f.release=resolve});
 return {result:validateWritingFeedback({score:12,scoreReason:'Errors in agreement and limited comparison reduce precision.',criteria:['linguistic','pragmatic','sociolinguistic'].map((id,i)=>({id,evidence:[{task:i+1,quote:responses[i].split(' ').slice(0,3).join(' ')}],reason:'Errors reduce the precision of the response.'})),tasks:[1,2,3].map(number=>({number,onTopic:true,mistakes:number===1&&responses[0].includes('Je suis aller')?[{original:'Je suis aller',corrected:'Je suis allé',explanation:'Use the past participle after être in the passé composé.'}]:[],issues:[]}))},{test,responses}),usage:{total_tokens:300}};
}}});
const client={auth:{onAuthStateChange:fn=>f.callbacks.push(fn),getSession:async()=>({data:{session:f.user?{access_token:'fixture',expires_at:Date.now()/1000+3600,user:{id:f.user}}:null}})}};
const examFetcher=async()=>Response.json({exams:[],history:[]});
const aiFetcher=async()=>Response.json({...snapshot(),activities:{writing:{credits:1},pronunciation:{credits:5},conversation:{credits:10}},conversations:[]});
const fetcher=async(url,init)=>handler(new Request(url,init));
wireExams(root,client,{fetcher:examFetcher});wireAiLearning(root,client,{fetcher:aiFetcher});f.ui=wireTcfWriting(root,client,{fetcher});
f.signOut=()=>{f.user=null;for(const fn of f.callbacks)fn('SIGNED_OUT',null)};
f.switchUser=()=>{f.user='22222222-2222-4222-8222-222222222222';for(const fn of f.callbacks)fn('SIGNED_IN',{user:{id:f.user}})};
window.fixtureReady=true;
</script></html>
