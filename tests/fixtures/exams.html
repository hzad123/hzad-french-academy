<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local-only exam acceptance fixture</title><link rel="stylesheet" href="/src/styles/academy.css"><div id="host"></div>
<script type="module">
import {template} from '/src/ui/template.js';
import {wireNavigation} from '/src/ui/navigation.js';
import {wireExams} from '/src/exams/ui.js';
import {createExamHandler} from '/supabase/functions/academy-exams/handler.js';
import {BANKS} from '/supabase/functions/academy-exams/banks.js';
document.querySelector('#host').innerHTML=template();const root=document.querySelector('#hzad-french-academy');root.querySelector('#hz-auth').classList.add('hz-hidden');root.querySelector('#hz-dashboard').classList.remove('hz-hidden');wireNavigation(root);
const user='11111111-1111-4111-8111-111111111111';
const f=window.fixture={now:0,rows:new Map(),calls:new Map(),providerCalls:0,requestCount:0};
const db={userRpc:async()=>({wallet:{available:500,reserved:0,budgetAvailable:true,expiresAt:'2099-01-01'},history:[...f.rows.values()].map(r=>({id:r.id,exam:r.exam,status:r.state.status,createdAt:'2026-11-05T12:00:00Z'})),exams:Object.values(BANKS).map(b=>({exam:b.exam,version:b.version,enabled:true,credits:50}))}),adminRpc:async(_,{p_action:action,p_id:id,p_payload:p})=>{
 let r=f.rows.get(id);
 if(action==='start'){if(!r){r={id,exam:p.exam,version:p.version,revision:0,state:p.state,settings:{},credits:p.credits};f.rows.set(id,r)}return structuredClone(r)}
 if(!r)throw Error('Exam attempt not found');
 if(action==='read')return {...structuredClone(r),callResults:[...f.calls.values()].filter(c=>c.status==='completed').map(c=>c.result)};
 if(action==='save'){if(r.revision!==p.revision)throw Error('Exam changed');r.state=p.state;r.revision++;return structuredClone(r)}
 if(action==='claim-call'){if(f.calls.has(p.callId))return {...f.calls.get(p.callId),claimed:false};const c={status:'dispatched'};f.calls.set(p.callId,c);return {...c,claimed:true}}
 if(action==='finish-call'){const c=f.calls.get(p.callId);c.status=p.result?'completed':'failed';c.result=p.result;return c}
 if(action==='close'){r.closed_at='closed';return structuredClone(r)}
 throw Error('Unexpected fixture operation');
}};
const provider={ready:()=>true,run:async ({kind,task,response})=>{
 f.providerCalls++;
 return {usage:{prompt_tokens:20},result:kind==='turn'?{transcript:'Bonjour, quels sont vos horaires ?',reply:'Nous ouvrons mercredi soir et samedi matin.',observations:['Clear greeting, with a short pause before the question.']}:{summary:'Your main purpose is clear. Add precise practical details and connect the ideas.',criteria:task.criteria.map(id=>({id,label:id,rating:response?2:0,evidence:response?[response.slice(0,60)]:[],strength:response?'The communicative purpose is recognisable.':'No response submitted.',improvement:'Add the time and place, then use a clear linking phrase.'})),corrections:[],improvedResponse:'Bonjour à tous ! Retrouvons-nous samedi à 10 h devant la bibliothèque.',priorities:['State the meeting time.','Give the location.','Use a clear closing.'],practice:[{instruction:'Write a new invitation with two practical details.',example:'Retrouvons-nous à 10 h devant la gare.'}]}}
}};
const storage={listeningUrl:async()=>'/tests/fixtures/exam-silence.wav',saveRecording:async()=>{},recording:async()=>''};
const handler=createExamHandler({authenticate:async()=>({id:user,email_confirmed_at:'yes'}),db,storage,provider,clock:()=>f.now});
const client={auth:{onAuthStateChange:()=>{},getSession:async()=>({data:{session:{access_token:'fixture',expires_at:Date.now()/1000+3600,user:{id:user}}}})}};
const fetcher=async(_url,init)=>{f.requestCount++;const response=await handler(new Request('https://local.invalid/academy-exams',init));if(!response.ok)console.log(await response.clone().text());return response};
const recorderFactory=parent=>{const p=document.createElement('p');p.textContent='Fixture microphone ready.';parent.append(p);return {dispose(){},isRecording:()=>false,getAudio:()=>f.audio}};
f.ui=wireExams(root,client,{fetcher,recorderFactory});
f.send=async body=>{const response=await fetcher('',{method:'POST',headers:{Authorization:'Bearer fixture','Content-Type':'application/json'},body:JSON.stringify(body)});return response.json()};
await f.ui.open();window.fixtureReady=true;
</script></html>
