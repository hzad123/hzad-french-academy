<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local audio administration fixture</title><link rel="stylesheet" href="/src/styles/academy.css"><div id="host"></div>
<script type="module">
import {template} from '/src/ui/template.js';
import {wireNavigation} from '/src/ui/navigation.js';
import {wireExamAudioAdmin} from '/src/exams/audio-admin.js';
import {wireExams} from '/src/exams/ui.js';
import {wireAiLearning} from '/src/ai/ui.js';
document.querySelector('#host').innerHTML=template();const root=document.querySelector('#hzad-french-academy');root.querySelector('#hz-auth').classList.add('hz-hidden');root.querySelector('#hz-dashboard').classList.remove('hz-hidden');wireNavigation(root);
const f=window.fixture={owner:new URLSearchParams(location.search).get('owner')!=='no',callbacks:[],generations:0,delay:20,signedIn:true,providerReady:true,calls:[],assets:Array.from({length:3},(_,i)=>({path:'synthetic/l'+(i+1)+'.mp3',exam:i<2?'tef-canada':'tcf-canada',ordinal:i<2?i+1:1,scriptHash:'a'.repeat(64),script:'Bonjour, le cours commence à dix heures. Question : à quelle heure commence le cours ?',status:'pending',reviewed:false,audioHash:null}))};

 f.calls.push({url,body:init.body?JSON.parse(init.body):null});
 if(url.endsWith('/academy-exams'))return new Response(JSON.stringify({canReviewContent:f.owner,wallet:{available:500,budgetAvailable:true,expiresAt:'2099-01-01'},history:[],exams:['tef-canada','tcf-canada'].map(exam=>({exam,enabled:false,credits:null,sections:{reading:{items:exam==='tef-canada'?40:39,seconds:3600},listening:{items:exam==='tef-canada'?40:39,seconds:2400},writing:{items:exam==='tef-canada'?2:3,seconds:3600},speaking:{items:exam==='tef-canada'?2:3,seconds:900}}}))}));
 if(url.endsWith('/academy-ai'))return new Response(JSON.stringify({enabled:true,includedCad:10,wallet:{available:500,reserved:0,budgetAvailable:true,expiresAt:'2099-01-01'},activities:Object.fromEntries(['writing','pronunciation','conversation'].map(kind=>[kind,{enabled:true,credits:1}])),history:[],conversations:[]}));

</script></html>
