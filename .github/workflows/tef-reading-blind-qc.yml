name: TEF Reading independent blind and passage-grounded QC
on:
  push:
    branches: [fix/tef-reading-six-blind-distractors-20261120]
    paths:
      - '.github/workflows/tef-reading-blind-qc.yml'
      - 'scripts/release/run-tef-reading-blind-qc.mjs'
      - 'scripts/release/stage-tef-reading-editorial-pilot.mjs'
      - 'scripts/release/tef-reading-advanced-36-39.json'
      - 'scripts/release/run-tef-reading-advanced-qc.mjs'
      - 'scripts/release/repair-tef-reading-with-ai.mjs'
      - 'scripts/lib/tef-reading-ai-quality.mjs'
      - 'tests/tef-reading-ai-quality.test.mjs'
permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write
concurrency:
  group: tef-reading-editorial-qc
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate quality control regression tests
        run: node --test tests/tef-reading-ai-quality.test.mjs
      - name: Independently review Q36–39 across all six tests
        env:
          TEF_READING_QC_URL: https://ogntvgvzmjrnppcullsj.supabase.co/functions/v1/academy-tef-reading-qc
          TEF_READING_QC_MAX_USD: '12'
          TEF_READING_QC_WORKERS: '3'
        run: node scripts/release/run-tef-reading-advanced-qc.mjs --pilot
      - name: Publish auditable pilot outcome in PR #95
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {writeFile} from 'node:fs/promises';
          let report;
          try {
            report=JSON.parse(await readFile('work/tef-reading-advanced-qc/summary.json','utf8'));
          } catch(err) {
            report={error:'No author-review summary was generated',details:String(err)};
          }
          let benchmark=null;
          try{benchmark=JSON.parse(await readFile('work/tef-reading-advanced-qc/summary.json','utf8'));}catch{}
          const status=benchmark?.completed===48&&benchmark?.newAll?.passed===24&&benchmark?.groundPassed===24&&benchmark?.blindAfterSameSample?.accuracy<=0.40&&benchmark?.blindBefore?.accuracy-benchmark?.blindAfterSameSample?.accuracy>=0.15?'Pilot benchmark passed':'Pilot NOT approved';
          const body=['## TEF Reading independent advanced Q36–39 audit', '', '**'+status+'**',
            'Workflow: '+process.env.GITHUB_SERVER_URL+'/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID,
            '', 'Attempted: '+(report.completed??'unavailable'),
            'Accepted: '+(report.newAll?.passed??'unavailable'),
            'Blocked: '+((report.newAll?.sample-report.newAll?.passed)||report.missing||0),
            'Estimated USD: '+(report.estimatedUsd??'unavailable'),
            '', 'Matched blind accuracy BEFORE: '+(benchmark?.blindBefore?.accuracy??'unavailable'),
            'Matched blind accuracy AFTER: '+(benchmark?.blindAfterSameSample?.accuracy??'unavailable'),
            'Reviewer approvals: '+(benchmark?.newAll?.passed??'unavailable')+'/'+(benchmark?.newAll?.sample??'unavailable'),
            '', 'Per test: `'+JSON.stringify(report.byTest??[])+'`',
            '', 'Errors (truncated):',
            '```json',JSON.stringify(report.errors??[report.error??'unknown']).slice(0,6000),'```',
            '', 'This audit covers the 24 targeted questions only. All other questions must remain unchanged.'
          ].join('\n');
          await writeFile('/tmp/tef-reading-review-comment.md',body);
          NODE
          gh pr comment 95 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/tef-reading-review-comment.md
      - name: Preserve verifiable model responses and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tef-reading-blind-qc-evidence
          path: work/tef-reading-advanced-qc
          retention-days: 30
