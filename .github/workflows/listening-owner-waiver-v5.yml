name: Record owner-waived TCF Listening01–06 v5
on:
  push:
    branches: [fix/listening-six-blind-cues-v5]
    paths:
      - .github/workflows/listening-owner-waiver-v5.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: listening-owner-waiver-v5-media
  cancel-in-progress: true
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository dependencies
        run: npm install --no-package-lock
      - name: Prepare six immutable banks from independently grounded v5 and v4 receipts
        run: |
          node scripts/release/prepare-listening-owner-waiver-v5.mjs
          node --test tests/listening-45-editorial-candidates.test.mjs tests/listening-github-oidc.test.mjs
      - name: Install pinned offline French speech and audio verifier
        run: |
          python -m pip install --disable-pip-version-check piper-tts==1.8.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download pinned French voices into temporary runner storage
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          python -m piper.download_voices --data-dir "$RUNNER_TEMP/models" fr_FR-siwis-medium fr_FR-tom-medium fr_FR-upmc-medium
      - name: Produce 234 complete recordings, preserving source and question clocks
        run: python scripts/render-listening-qc-media.py --owner-waiver --root work/listening-owner-waiver-v5 --models "$RUNNER_TEMP/models"
      - name: Re-verify all six final answer keys, question hashes, timings, images, MP3s
        run: |
          for number in 01 02 03 04 05 06; do
            version="tcf-listening-2026-11-test$number-v5"
            node scripts/check-listening-owner-waiver-v5.mjs --bank "supabase/exams/tcf-listening-test$number-v5.json" --evidence "curriculum/tcf-listening-owner-waiver-v5/$version" --media
          done
          npm test
          npm run build
      - name: Commit verified immutable six-paper assets (never activate database)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tcf-listening/tcf-listening-2026-11-test0?-v5
          git add supabase/exams/tcf-listening-test0?-v5.json
          git add curriculum/tcf-listening-owner-waiver-v5
          if ! git diff --cached --quiet; then
            git commit -m "Record six owner-waived listening v5 papers with 234 independently grounded keys"
          fi
          git fetch origin fix/listening-six-blind-cues-v5
          git rebase origin/fix/listening-six-blind-cues-v5
          git push origin HEAD:fix/listening-six-blind-cues-v5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-waived-tcf-listening-six-v5
          path: |
            work/listening-owner-waiver-v5/summary.json
            supabase/exams/tcf-listening-test0?-v5.json
            curriculum/tcf-listening-owner-waiver-v5/
            assets/tcf-listening/tcf-listening-2026-11-test0?-v5/
          retention-days: 30
