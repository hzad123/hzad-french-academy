name: Render original TCF Listening Test 02 audio
on:
  push:
    branches: [feature/tcf-listening-multitest-engine]
    paths:
      - .github/workflows/render-tcf-listening-test02.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test02:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tcf-listening-multitest-engine
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline speech synthesis tool
        run: |
          python -m pip install --disable-pip-version-check piper-tts==1.8.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download three French neural voices into temporary runner storage
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          python -m piper.download_voices --data-dir "$RUNNER_TEMP/models" fr_FR-siwis-medium fr_FR-tom-medium fr_FR-upmc-medium
          ls -lh "$RUNNER_TEMP/models"/*.onnx
      - name: Assemble and validate original French question scripts
        run: node scripts/assemble-tcf-listening-test02.mjs
      - name: Synthesize all 39 recordings and immutable exam bank
        run: python scripts/render-tcf-listening-test02.py --models "$RUNNER_TEMP/models"
      - name: Verify MP3s, images, answer keys and exact 35-minute clock
        run: node scripts/check-tcf-listening-test02-media.mjs
      - name: Commit only completed media and paper to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tcf-listening/tcf-listening-2026-11-test02-v1 supabase/exams/tcf-listening-test02.json
          if git diff --cached --quiet; then echo "No audio changes"; exit 0; fi
          git commit -m "Build and verify 39 real French recordings for TCF Listening Test 02"
          git fetch origin feature/tcf-listening-multitest-engine
          git rebase origin/feature/tcf-listening-multitest-engine
          git push origin HEAD:feature/tcf-listening-multitest-engine
