name: Inspect TEF Reading QC runs
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    if: github.head_ref == 'fix/tef-reading-six-blind-distractors-20261120'
    runs-on: ubuntu-latest
    steps:
      - name: Locate existing independent review runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/tef-reading-blind-qc.yml/runs?branch=fix%2Ftef-reading-six-blind-distractors-20261120&per_page=10" --jq '.workflow_runs[] | {id,head_sha,status,conclusion,html_url}'
      - name: Inspect actual academy Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?branch=development&per_page=10" --jq '.workflow_runs[] | {id,head_sha,status,conclusion,html_url}'
          base=https://hzad123.github.io/hzad-french-academy
          curl -fsSL "$base/BUILD_COMMIT.txt?check=$GITHUB_RUN_ID" -o /tmp/academy-revision
          printf 'LIVE_REVISION='; cat /tmp/academy-revision; echo
          curl -fsSL "$base/academy-app.js?check=$GITHUB_RUN_ID" -o /tmp/academy-app.js
          node --input-type=module -e "import {readFileSync} from 'node:fs';const s=readFileSync('/tmp/academy-app.js','utf8');console.log(JSON.stringify({oldAxis:s.includes('196-')&&s.includes('*4.6'),hasNewAxis:s.includes('maximumSignificantDigits:8'),hasTutor:s.includes('HZad French Tutor')&&s.includes('academy-french-tutor'),hasTeFDropdown:s.includes('hz-tef-dropdown'),hasOldAdmin:s.includes('Continue generating exam audio')}))"
          curl -fsSL 'https://teftcf.hzadeducation.org/hzadfrenchacademy' -o /tmp/ghl.html || true
          if [ -f /tmp/ghl.html ]; then grep -oE 'https://[^" <>]+/academy(-app)?\\.js[^" <>]*' /tmp/ghl.html | head -10 || true; fi
