name: TEF Listening new-paper media
on:
  pull_request:
    branches: [development]
    paths:
      - 'curriculum/tef-listening-08-20/**'
      - 'scripts/release/*tef-listening-08-20*'
      - 'scripts/check-tef-listening-08-20-measured.mjs'
      - '.github/workflows/tef-listening-08-20.yml'
jobs:
  measure:
    if: github.head_ref == 'feature/tef-listening-08-20-development' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 90
    concurrency:
      group: tef-08-20-measure
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned French voice runtime
        run: |
          python -m pip install --disable-pip-version-check piper-tts==1.8.0
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          mkdir -p "$RUNNER_TEMP/models"
          python -m piper.download_voices --data-dir "$RUNNER_TEMP/models" fr_FR-siwis-medium fr_FR-tom-medium
      - name: Build and measure authored papers
        run: |
          for source in curriculum/tef-listening-08-20/test-[0-9][0-9].mjs; do
            t=$(basename "$source" .mjs)
            t=${t#test-}
            node scripts/release/prepare-tef-listening-08-20.mjs "$t"
            python scripts/release/render-tef-listening-08-20.py --models "$RUNNER_TEMP/models" --test "$t"
            node scripts/check-tef-listening-08-20-measured.mjs "$t"
            git add "supabase/exams/tef-listening-test$t-v1.json" "assets/tef-listening/tef-listening-2026-11-test$t-v1"
          done
      - name: Stage verified media, never activate production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Stage measured new TEF Listening papers (editorial QA pending)"
            git push origin HEAD:feature/tef-listening-08-20-development
          fi
