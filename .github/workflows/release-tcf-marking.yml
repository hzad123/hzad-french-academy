name: Release TCF marking backend
# Explicit owner-authorized repair only. No deployment on PRs/untrusted forks.
on:
  push:
    branches: [feature/owner-ai-testing-and-retry-20261110]
permissions:
  contents: read
concurrency:
  group: tcf-marking-backend-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm test
      - run: npm run build
      - name: Bundle the normal JWT-protected writing function
        run: >-
          node --input-type=module -e "import {build} from 'esbuild'; await build({entryPoints:['supabase/functions/academy-tcf-writing/index.ts'],bundle:true,platform:'neutral',format:'esm',target:'es2022',outfile:'/tmp/tcf-marking-release.ts'});"
      - name: Rehearse, preserve student work, apply the reviewed release and deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/release/tcf-marking.py --apply --bundle /tmp/tcf-marking-release.ts
