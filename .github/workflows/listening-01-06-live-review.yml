name: Prepare owner-requested Listening01–06 review release
on:
  push:
    branches: [feature/listening-01-06-live-review]
    paths:
      - .github/workflows/listening-01-06-live-review.yml
      - scripts/prepare-listening-01-06-live-review.mjs
      - scripts/lib/listening-answer-qc.mjs
      - scripts/lib/listening-owner-review.mjs
      - scripts/release/run-listening-answer-qc.py
      - curriculum/tcf-listening-owner-review-editorial-fixes.json
      - supabase/functions/academy-listening-qc/**
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: listening-independent-answer-qc
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install --no-package-lock
      - run: python -m pip install --disable-pip-version-check cairosvg==2.8.2
      - uses: actions/cache/restore@v4
        with:
          path: |
            work/listening-answer-qc
            work/listening-owner-review-01-06
          key: listening-review-01-06-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            listening-review-01-06-
            listening-answer-qc-v1-
      - name: Bundle unchanged private authoring service
        run: >-
          node --input-type=module -e "import {build} from 'esbuild'; await build({entryPoints:['supabase/functions/academy-listening-qc/index.ts'],bundle:true,platform:'neutral',format:'esm',target:'es2022',outfile:'/tmp/listening-qc.ts'});"
      - name: Author six revised banks and verify unique answers independently
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python scripts/release/run-listening-answer-qc.py --bundle /tmp/listening-qc.ts --script scripts/prepare-listening-01-06-live-review.mjs --out work/listening-owner-review-01-06 --max-usd 35
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            work/listening-answer-qc
            work/listening-owner-review-01-06
          key: listening-review-01-06-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listening-01-06-owner-review-${{ github.run_id }}
          path: work/listening-owner-review-01-06
          retention-days: 30
      - name: Preserve actual revised content and diagnostic evidence
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          src=Path('work/listening-owner-review-01-06');out=Path('curriculum/tcf-listening-owner-review-01-06-source')
          if not src.exists():raise SystemExit(0)
          out.mkdir(parents=True,exist_ok=True)
          for name in ['summary.json','progress.json','seed.json']:
            if (src/name).exists():shutil.copyfile(src/name,out/name)
          for folder in src.glob('test??'):
            dest=out/folder.name;dest.mkdir(exist_ok=True)
            for name in ['bank.json','evidence.json']:
              if (folder/name).exists():shutil.copyfile(folder/name,dest/name)
            shutil.copytree(folder/'images',dest/'images',dirs_exist_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curriculum/tcf-listening-owner-review-01-06-source
          if ! git diff --cached --quiet; then
            git commit -m "Retain revised Listening01–06 candidates with actual grounding and blind diagnostics"
            git fetch origin feature/listening-01-06-live-review
            git rebase origin/feature/listening-01-06-live-review
            git push origin HEAD:feature/listening-01-06-live-review
          fi
