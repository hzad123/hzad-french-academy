name: Release TCF speaking Test01
on:
  push:
    branches: [feature/tcf-speaking-test-01-20261112, fix/tcf-speaking-submit-flow-20261112]
permissions:
  contents: read
concurrency:
  group: tcf-speaking-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm test
      - run: npm run build
      - name: Bundle speaking function
        run: >-
          node --input-type=module -e "import {build} from 'esbuild'; await build({entryPoints:['supabase/functions/academy-tcf-speaking/index.ts'],bundle:true,platform:'neutral',format:'esm',target:'es2022',outfile:'/tmp/tcf-speaking-release.ts'});"
      - name: Preserve data, deploy and activate Test01
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/release/tcf-speaking.py --apply --bundle /tmp/tcf-speaking-release.ts
