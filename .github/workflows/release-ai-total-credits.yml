name: Release AI total-credit limits
on:
  push:
    branches: [fix/ai-total-credits-only]
permissions:
  contents: read
concurrency:
  group: ai-total-credit-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm test
      - run: npm run build
      - name: Rehearse and preserve all balances before removing daily counts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/release/ai-total-credits.py
