name: Deploy academy preview
# Rebuild preview with versioned assets for bilingual lesson cards.
on:
  push:
    branches: [development]
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and test"]
    types: [completed]
    branches: [feature/a0-learning]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: academy-preview-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Checkout A0 feature into isolated folder
        uses: actions/checkout@v4
        with:
          ref: feature/a0-learning
          path: a0-feature
      - name: Build and test A0 feature
        working-directory: a0-feature
        run: |
          npm install
          npm test
          npm run build
      - name: Copy A0 feature preview into separate Pages path
        run: |
          mkdir -p dist/a0-preview
          cp -R a0-feature/dist/. dist/a0-preview/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
