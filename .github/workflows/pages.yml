name: Deploy academy preview
# Deploy tested 30-lesson A0 practice lab and audio questions to isolated preview; root unchanged.
on:
  push:
    branches: [development]
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and test"]
    types: [completed]
    branches: [feature/a0-learning]
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
concurrency:
  group: academy-preview-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Checkout A0 feature into isolated folder
        uses: actions/checkout@v4
        with:
          ref: 64366c2ae8deba304150e80bebc59678eb04f961
          path: a0-feature
      - name: Build and test A0 feature
        working-directory: a0-feature
        run: |
          npm install
          npm test
          npm run build
      - name: Copy A0 feature preview into separate Pages path
        run: |
          mkdir -p dist/a0-preview
          cp -R a0-feature/dist/. dist/a0-preview/
          git -C a0-feature rev-parse HEAD > dist/a0-preview/BUILD_COMMIT.txt
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for GitHub Pages artifact indexing
        # GitHub occasionally returns zero artifacts immediately after a
        # successful upload, which otherwise makes deploy-pages fail.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 20); do
            artifacts=$(curl --fail --silent --show-error --location --retry 2 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")
            artifact_id=$(printf '%s' "$artifacts" | jq -r '.artifacts[] | select(.name=="github-pages" and .expired==false) | .id' | head -n 1)
            if [ -n "$artifact_id" ]; then
              echo "GitHub Pages deployment artifact is indexed."
              exit 0
            fi
            sleep 5
          done
          echo "::error::The uploaded GitHub Pages artifact did not become visible."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
