name: Verify and stage TEF Listening 01 grouped v2 bank
on:
  push:
    branches: [fix/tef-listening-01-realistic-grouped-audio-v2]
    paths:
      - .github/workflows/tef-listening-01-v2-migration.yml
      - scripts/release/write-tef-listening-01-grouped-v2-migration.mjs
      - supabase/exams/tef-listening-test01-v2.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tef-listening-01-v2-migration
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - run: npm install --no-package-lock
      - name: Verify source bank, paired questions and rendered audio exist
        run: |
          test -f supabase/exams/tef-listening-test01-v2.json
          test -f assets/tef-listening/tef-listening-2026-11-test01-v2/manifest.json
          node scripts/check-tef-listening-test01-v2.mjs
      - name: Generate immutable v2 Supabase migration, do not apply
        run: |
          if ! find supabase/migrations -maxdepth 1 -name '*_tef_listening_01_grouped_v2.sql' | grep -q .; then
            supabase migration new tef_listening_01_grouped_v2
          fi
          migration=$(find supabase/migrations -maxdepth 1 -name '*_tef_listening_01_grouped_v2.sql' | head -n 1)
          node scripts/release/write-tef-listening-01-grouped-v2-migration.mjs "$migration"
          node --check src/exams/tef-listening/ui.js
          npm test
          npm run build
      - name: Commit immutable source bank migration on review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/*_tef_listening_01_grouped_v2.sql
          if ! git diff --cached --quiet; then
            git commit -m "Stage TEF listening v2 secure group-aware server exam migration"
            git fetch origin fix/tef-listening-01-realistic-grouped-audio-v2
            git rebase origin/fix/tef-listening-01-realistic-grouped-audio-v2
            git push origin HEAD:fix/tef-listening-01-realistic-grouped-audio-v2
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tef-listening-01-grouped-migration-draft
          path: supabase/migrations/*_tef_listening_01_grouped_v2.sql
          retention-days: 30
