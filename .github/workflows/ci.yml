name: Build and test
on:
  push:
    branches: [main, development, "feature/**"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: node scripts/validate-curriculum.mjs curriculum/a0-batch-01.json
      - run: npm run build
      - name: Upload isolated A0 test build
        if: startsWith(github.ref, 'refs/heads/feature/')
        uses: actions/upload-artifact@v4
        with:
          name: a0-student-preview
          path: dist/
          retention-days: 7


  tef02_04_authoring:
    if: github.ref == 'refs/heads/feature/tef-listening-tests-02-07-original-banks' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tef-listening-tests-02-07-original-banks
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Test02 original 40-question editorial draft
        run: |
          node scripts/release/prepare-tef-listening-original-batch.mjs 2
          node scripts/release/prepare-tef-listening-original-batch.mjs 3
          node scripts/release/prepare-tef-listening-original-batch.mjs 4
      - name: Stage draft bank and four original illustrations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/exams/tef-listening-test0{2,3,4}-v1.json assets/tef-listening/tef-listening-2026-11-test0{2,3,4}-v1/
          if ! git diff --cached --quiet; then
            git commit -m "Stage unpublished original TEF Listening Test02 editorial bank and illustrations"
            git fetch origin feature/tef-listening-tests-02-07-original-banks
            git rebase origin/feature/tef-listening-tests-02-07-original-banks
            git push origin HEAD:feature/tef-listening-tests-02-07-original-banks
          fi
