name: Build and test
on:
  push:
    branches: [main, development, "feature/**", "fix/tef-listening-01-v3-audio-timing-audit"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: node scripts/validate-curriculum.mjs curriculum/a0-batch-01.json
      - run: npm run build
      - name: Upload isolated A0 test build
        if: startsWith(github.ref, 'refs/heads/feature/')
        uses: actions/upload-artifact@v4
        with:
          name: a0-student-preview
          path: dist/
          retention-days: 7

  tef_v3_render:
    if: github.ref == 'refs/heads/feature/tef-listening-v3-render' && github.repository == 'hzad123/hzad-french-academy'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tef-listening-v3-render
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline French speech generator
        run: |
          python -m pip install --disable-pip-version-check piper-tts==1.8.0
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          mkdir -p "$RUNNER_TEMP/models"
          python -m piper.download_voices --data-dir "$RUNNER_TEMP/models" fr_FR-siwis-medium fr_FR-tom-medium
      - name: Render immutable measured v3 audio and bank
        run: |
          node scripts/release/prepare-tef-listening-test01-v3.mjs
          python scripts/release/render-tef-listening-test01-v3.py --models "$RUNNER_TEMP/models"
          node scripts/check-tef-listening-test01-v3.mjs
      - name: Commit staged media to same review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/exams/tef-listening-test01-v3.json assets/tef-listening/tef-listening-2026-11-test01-v3
          if ! git diff --cached --quiet; then
            git commit -m "Render and verify TEF Test01 v3 36 recorded passages"
            git push origin HEAD:feature/tef-listening-v3-render
          fi

# Trigger isolated original French recording rendering on feature branch.
