name: Editorial QA - TCF listening uniqueness and distractors
on:
  push:
    branches: [feature/tcf-listening-03-20-reviewed]
    paths:
      - '.github/workflows/audit-tcf-listening-quality.yml'
      - 'scripts/*listening*'
      - 'scripts/lib/listening-quality.mjs'
      - 'curriculum/tcf-listening-*/**'
      - 'supabase/exams/tcf-listening-*.json'
      - 'assets/tcf-listening/**'
  pull_request:
    paths:
      - '.github/workflows/audit-tcf-listening-quality.yml'
      - 'scripts/*listening*'
      - 'scripts/lib/listening-quality.mjs'
      - 'curriculum/tcf-listening-*/**'
      - 'supabase/exams/tcf-listening-*.json'
      - 'assets/tcf-listening/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install recording integrity tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Audit all 18 best existing candidates, media and pending editorial evidence
        run: node scripts/audit-tcf-listening-quality.mjs --media
      - name: Save quality report even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcf-listening-editorial-qa-report
          path: reports/tcf-listening-candidate-qa.json
