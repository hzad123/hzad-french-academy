name: Release TEF Writing backend
on:
  push:
    branches: [development]
    paths:
      - "supabase/functions/academy-tef-writing/**"
      - "supabase/exams/tef-writing-tests.json"
      - "scripts/release/tef-writing-deploy.py"
      - ".github/workflows/release-tef-writing.yml"
permissions:
  contents: read
concurrency:
  group: tef-writing-edge-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Bundle server-only TEF Writing Function
        run: >-
          node --input-type=module -e "import {build} from 'esbuild'; await build({entryPoints:['supabase/functions/academy-tef-writing/index.ts'],bundle:true,platform:'neutral',format:'esm',target:'es2022',outfile:'/tmp/tef-writing-release.ts'});"
      - name: Deploy protected TEF Writing Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/release/tef-writing-deploy.py --bundle /tmp/tef-writing-release.ts
