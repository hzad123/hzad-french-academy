name: Record TCF Listening 15-20 draft French audio (not a release)
on:
  push:
    branches: [review/tcf-listening-15-20-quality-20261119]
    paths:
      - scripts/release/record-listening-15-20-v2-draft.py
      - scripts/release/prepare-listening-15-20-q25-audio-fixes.mjs
      - .github/workflows/tcf-listening-15-20-draft-recording.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: listening-15-20-draft-recording
  cancel-in-progress: false
jobs:
  draft-record:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned offline speech system
        run: |
          python -m pip install --disable-pip-version-check piper-tts==1.8.0
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            timeout 150s sudo apt-get update -qq
            timeout 150s sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
      - name: Download French models with pinned integrity checks in renderer
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          python -m piper.download_voices --data-dir "$RUNNER_TEMP/models" fr_FR-siwis-medium fr_FR-tom-medium fr_FR-upmc-medium
      - name: Prepare six source-preserving banks and edited Q25 scripts
        run: |
          node scripts/release/prepare-listening-15-20-v2-draft.mjs
          node scripts/release/prepare-listening-15-20-q25-audio-fixes.mjs
      - name: Rerecord edited source and verify all 234 audio clips
        run: |
          python scripts/release/record-listening-15-20-v2-draft.py --models "$RUNNER_TEMP/models"
      - name: Keep drafts on the review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/exams/tcf-listening-test{15..20}-v2.json
          git add assets/tcf-listening/tcf-listening-2026-11-test{15..20}-v2
          if ! git diff --cached --quiet; then
            git commit -m "Stage six TCF Listening draft banks and verified rerecorded source; no publication"
            git fetch origin review/tcf-listening-15-20-quality-20261119
            git rebase origin/review/tcf-listening-15-20-quality-20261119
            git push origin HEAD:review/tcf-listening-15-20-quality-20261119
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listening-15-20-draft-recording
          path: |
            work/tcf-listening-15-20-v2/summary.json
            work/tcf-listening-15-20-v2/media-result.json
            work/tcf-listening-15-20-v2/editorial/q25-audio-corrections.json
          retention-days: 30
