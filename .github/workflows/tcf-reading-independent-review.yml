name: Independent TCF Reading 01-06 quality review
on:
  push:
    branches:
      - feature/tcf-reading-01-06-advanced-quality-20261118
  workflow_dispatch:
    inputs:
      scope:
        description: 'Review scope: sample (Q30/37/39 of six papers) or full (all 90 advanced items)'
        required: true
        type: choice
        default: sample
        options:
          - sample
          - full
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY_TCF_REVIEW: ${{ secrets.OPENAI_API_KEY_TCF_REVIEW }}
      TCF_REVIEW_MODEL: gpt-4o-mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - name: Full deterministic regression tests
        run: npm test
      - name: Build existing GHL application
        run: npm run build
      - name: Static audit of all six candidate papers
        run: node scripts/review-tcf-reading-ai.mjs --lint
        env:
          TCF_REVIEW_REPORT: tcf-reading-static-report.json
      - name: Independent blind review then separate grounded review
        shell: bash
        env:
          TCF_REVIEW_REPORT: tcf-reading-ai-report.json
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.scope }}" = "full" ]; then
            node scripts/review-tcf-reading-ai.mjs --full
          else
            node scripts/review-tcf-reading-ai.mjs --sample
          fi
      - name: Archive quality reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcf-reading-review-report
          path: |
            tcf-reading-static-report.json
            tcf-reading-ai-report.json
          if-no-files-found: warn
