name: Render TEF Listening Test02 measured original audio
on:
  push:
    branches: [feature/tef-listening-tests-02-07-original-banks]
    paths:
      - .github/workflows/tef-listening-01-v2-audio.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tef-listening-batch-02-07-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tef-listening-tests-02-07-original-banks
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned offline French voices and FFmpeg
        run: |
          python -m pip install --disable-pip-version-check piper-tts==1.8.0
          if ! command -v ffmpeg >/dev/null 2>&1; then
            timeout 150s sudo apt-get update -qq
            timeout 150s sudo apt-get install -y -qq ffmpeg
          fi
          mkdir -p "$RUNNER_TEMP/models"
          python -m piper.download_voices --data-dir "$RUNNER_TEMP/models" fr_FR-siwis-medium fr_FR-tom-medium
      - name: Render exact original Test02 bank, or fail if timings cannot fit
        run: |
          node scripts/release/prepare-tef-listening-original-batch.mjs 2
          python scripts/release/render-tef-listening-batch-02-07.py --bank tef-listening-test02-v1.json --models "$RUNNER_TEMP/models"
      - name: Stage source-matched measured audio on draft branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/exams/tef-listening-test02-v1.json assets/tef-listening/tef-listening-2026-11-test02-v1/
          if ! git diff --cached --quiet; then
            git commit -m "Stage measured TEF Listening Test02 original audio (unpublished)"
            git fetch origin feature/tef-listening-tests-02-07-original-banks
            git rebase origin/feature/tef-listening-tests-02-07-original-banks
            git push origin HEAD:feature/tef-listening-tests-02-07-original-banks
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tef-listening-test02-original-audio-evidence
          path: |
            supabase/exams/tef-listening-test02-v1.json
            assets/tef-listening/tef-listening-2026-11-test02-v1/manifest.json
          retention-days: 30
