name: Verify corrected TEF Listening Tests 03-07 measured original audio
on:
  push:
    branches: [feature/tef-listening-tests-02-07-original-banks]
    paths:
      - .github/workflows/tef-listening-01-v2-audio.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        number: [3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tef-listening-tests-02-07-original-banks
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned offline French voices and FFmpeg
        run: |
          python -m pip install --disable-pip-version-check piper-tts==1.8.0
          if ! command -v ffmpeg >/dev/null 2>&1; then
            timeout 150s sudo apt-get update -qq
            timeout 150s sudo apt-get install -y -qq ffmpeg
          fi
          mkdir -p "$RUNNER_TEMP/models"
          python -m piper.download_voices --data-dir "$RUNNER_TEMP/models" fr_FR-siwis-medium fr_FR-tom-medium
      - name: Render 36 actual audio recordings for independent Test ${{ matrix.number }}
        env:
          TEST_NO: ${{ matrix.number }}
        run: |
          node scripts/release/prepare-tef-listening-original-batch.mjs "$TEST_NO"
          python scripts/release/render-tef-listening-batch-02-07.py --bank "tef-listening-test0${TEST_NO}-v1.json" --models "$RUNNER_TEMP/models"
      - name: Stage only the measured test on an isolated unpublished branch
        env:
          TEST_NO: ${{ matrix.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "supabase/exams/tef-listening-test0${TEST_NO}-v1.json" "assets/tef-listening/tef-listening-2026-11-test0${TEST_NO}-v1/"
          git commit -m "Stage measured original TEF Listening Test0${TEST_NO} audio (unpublished)"
          git push origin HEAD:"refs/heads/feature/tef-listening-test0${TEST_NO}-measured-audio"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tef-listening-test0${{ matrix.number }}-audio-evidence
          path: |
            supabase/exams/tef-listening-test0${{ matrix.number }}-v1.json
            assets/tef-listening/tef-listening-2026-11-test0${{ matrix.number }}-v1/manifest.json
          retention-days: 30
