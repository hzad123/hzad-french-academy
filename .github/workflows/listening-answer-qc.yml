name: Strict blind quality for Listening Tests01–06
on:
  # A single scoped review-branch update resumes offline authoring without
  # allowing a normal result-checkpoint push to schedule paid calls.
  push:
    branches: [fix/listening-six-blind-cues-v5]
    paths:
      - .github/workflows/listening-answer-qc.yml
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: listening-independent-answer-qc
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install --no-package-lock
      - run: node --test tests/listening-answer-qc.test.mjs tests/listening-contrast-quality.test.mjs
      - run: python -m pip install --disable-pip-version-check cairosvg==2.8.2
      - uses: actions/cache/restore@v4
        with:
          path: work/listening-six-contrast-v2
          key: listening-six-contrast-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: listening-six-contrast-v2-
      - name: Preserve saved review evidence when there is no prior Actions cache
        run: |
          python - <<'PYTHON'
          import shutil
          from pathlib import Path
          src=Path('curriculum/tcf-listening-contrast-v2-source')
          dest=Path('work/listening-six-contrast-v2')
          if not (dest/'progress.json').exists() and (src/'progress.json').exists():
            shutil.copytree(src,dest,dirs_exist_ok=True)
            print('Restored saved review evidence from GitHub. No prior candidate discarded.')
          else:
            print('Using existing Actions review cache; no repository snapshot overwrite.')
          PYTHON
      - name: Validate private OIDC QC health without paid inference
        env:
          LISTENING_QC_URL: https://ogntvgvzmjrnppcullsj.supabase.co/functions/v1/academy-listening-oidc
        run: |
          node --input-type=module -e "import {githubOidcFetch} from './scripts/lib/listening-github-oidc.mjs'; const response=await githubOidcFetch()(process.env.LISTENING_QC_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stage:'health'})}); if(!response.ok)throw Error('Private offline evaluator authentication failed: HTTP'+response.status);const health=await response.json();if(!health.ready)throw Error('Private offline evaluator is not ready'); console.log('Scoped OIDC and private evaluator health verified; no AI calls.');"
      - name: Fresh baseline, strict pilot, full repair and frozen blind experiment
        env:
          LISTENING_QC_URL: https://ogntvgvzmjrnppcullsj.supabase.co/functions/v1/academy-listening-oidc
          LISTENING_QC_AUTH_MODE: github-oidc
        run: node scripts/run-listening-six-contrast-qc.mjs --out work/listening-six-contrast-v2 --workers 12 --max-usd 120 --finish-batch
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: work/listening-six-contrast-v2
          key: listening-six-contrast-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-listening-six-${{ github.run_id }}
          path: work/listening-six-contrast-v2
          retention-days: 30
      - name: Preserve actual results, including rejected candidates
        if: always() && github.ref_name == 'fix/listening-six-blind-cues-v5'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Update the clean checkout before copying a coherent result set.
          # Model work is retained in the ignored cache directory. Merging
          # individual generated JSON snapshots after copying causes conflicts.
          git fetch origin fix/listening-six-blind-cues-v5
          git rebase origin/fix/listening-six-blind-cues-v5
          python - <<'PYTHON'
          from pathlib import Path
          import shutil
          src=Path('work/listening-six-contrast-v2');dest=Path('curriculum/tcf-listening-contrast-v2-source')
          if src.exists():
            dest.mkdir(parents=True,exist_ok=True)
            for item in src.iterdir():
              if item.name=='model-receipts':continue
              target=dest/item.name
              if item.is_dir():shutil.copytree(item,target,dirs_exist_ok=True)
              else:shutil.copyfile(item,target)
          PYTHON
          git add curriculum/tcf-listening-contrast-v2-source
          if ! git diff --cached --quiet; then
            git commit -m "Retain actual strict listening contrast evaluation results"
            git fetch origin fix/listening-six-blind-cues-v5
            git rebase origin/fix/listening-six-blind-cues-v5
            git push origin HEAD:fix/listening-six-blind-cues-v5
          fi
